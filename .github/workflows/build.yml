name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/voidtouch.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/voidtouch.jks" >> "$GITHUB_ENV"
          else
            echo "Sem KEYSTORE_BASE64: assinando com a chave de debug."
          fi

      - name: Rodar testes
        run: ./gradlew testDebugUnitTest --stacktrace

      # Análise estática (lint): por enquanto só informa, não bloqueia a versão. O relatório fica no artefato.
      - name: Lint
        continue-on-error: true
        run: ./gradlew lintRelease --stacktrace

      - name: Resumo do lint no log
        if: always()
        run: |
          python3 - <<'PY'
          import glob, collections
          import xml.etree.ElementTree as ET
          files = glob.glob("app/build/reports/lint-results-release.xml")
          if not files:
              print("LINT: sem relatório")
          else:
              root = ET.parse(files[0]).getroot()
              issues = root.findall("issue")
              count = collections.Counter((i.get("severity"), i.get("id")) for i in issues)
              print("LINT TOTAL:", len(issues))
              for (sev, iid), n in sorted(count.items(), key=lambda x: (x[0][0], -x[1])):
                  print(f"LINT {n:3d} {sev} {iid}")
              for i in issues:
                  if i.get("severity") in ("Error", "Fatal", "Warning"):
                      loc = i.find("location")
                      where = (loc.get("file").split("launcher/")[-1] + ":" + str(loc.get("line"))) if loc is not None else "?"
                      print("LINTDETAIL", i.get("severity"), i.get("id"), where, "|", i.get("message")[:150])
          PY

      - name: Relatório do lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore

      - name: Compilar APK release (otimizado)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Publicar APK release
        uses: actions/upload-artifact@v4
        with:
          name: voidtouch-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Só com a chave fixa: publica a versão como Release, que o app consulta para se atualizar.
      - name: Publicar Release no GitHub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/*.apk voidtouch.apk
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" voidtouch.apk --clobber
          else
            gh release create "v$VER" voidtouch.apk --title "VoidTouch $VER" --notes "VoidTouch $VER" --target "$GITHUB_SHA"
          fi
