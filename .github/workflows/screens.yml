name: Capturas de tela

# Separado do release: não publica nada e não bloqueia a versão. Baixe as imagens do artefato.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Gerar capturas
        run: ./gradlew testDebugUnitTest -Pscreens --tests "*screens*" --stacktrace
      - name: Guardar imagens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: app/build/screens/*.png
          if-no-files-found: warn
